name: Psalm

on:
  push:
    paths:
      - 'core/**'
      - 'psalm.xml'
      - 'composer.json'
      - 'composer.lock'
      - '.github/workflows/psalm.yml'
  pull_request:
    paths:
      - 'core/**'
      - 'psalm.xml'
      - 'composer.json'
      - 'composer.lock'
      - '.github/workflows/psalm.yml'

jobs:
  psalm:
    runs-on: ubuntu-latest
    name: Psalm

    steps:

      - name: Checkout
        uses: actions/checkout@v6

      # The split sub-packages pin testo/testo; in CI the root is a detached
      # commit (dev-<sha>), so its version must be declared explicitly.
      - name: Resolve root package version
        run: echo "COMPOSER_ROOT_VERSION=$(jq -r '.["."]' resources/version.json)" >> "$GITHUB_ENV"

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          coverage: none

      - name: Install Composer dependencies
        uses: ramsey/composer-install@v3
        with:
          dependency-versions: highest

      - name: Run Psalm
        run: composer psalm:ci
