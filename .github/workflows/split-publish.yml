---

# Splits plugin/bridge subtrees into their own dedicated repositories
# whenever release-please tags a new component release in the monorepo.
#
# A single matrix-driven job covers every component. Each row decides via
# `if: startsWith(github.ref, …)` whether it runs for the current tag —
# a tag like `repeat-0.1.0` activates exactly one matrix entry.
#
# Tag format follows the project convention `include-v-in-tag: false`:
# `<component>-X.Y.Z`, no `v` prefix anywhere.
#
# Required secrets:
#   - RELEASE_TOKEN: a GitHub token (PAT or fine-grained) with `contents: write`
#     access to every target repo. Same secret is reused for release-please.

on:  # yamllint disable-line rule:truthy
  push:
    tags:
      - 'assert-[0-9]*'
      - 'bench-[0-9]*'
      - 'bridge-infection-[0-9]*'
      - 'bridge-symfony-[0-9]*'
      - 'codecov-[0-9]*'
      - 'convention-[0-9]*'
      - 'data-[0-9]*'
      - 'filter-[0-9]*'
      - 'inline-[0-9]*'
      - 'lifecycle-[0-9]*'
      - 'output-teamcity-[0-9]*'
      - 'repeat-[0-9]*'
      - 'retry-[0-9]*'
      - 'test-[0-9]*'

name: 📦 Split publish

jobs:
  split:
    name: ↪ ${{ matrix.directory }} → php-testo/${{ matrix.target }}
    if: startsWith(github.ref, format('refs/tags/{0}-', matrix.component))
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { component: assert,            directory: plugin/assert,            target: assert }
          - { component: bench,             directory: plugin/bench,             target: bench }
          - { component: bridge-infection,  directory: bridge/infection,         target: bridge-infection }
          - { component: bridge-symfony,    directory: bridge/symfony,           target: bridge-symfony }
          - { component: codecov,           directory: plugin/codecov,           target: codecov }
          - { component: convention,        directory: plugin/convention,        target: convention }
          - { component: data,              directory: plugin/data,              target: data }
          - { component: filter,            directory: plugin/filter,            target: filter }
          - { component: inline,            directory: plugin/inline,            target: inline }
          - { component: lifecycle,         directory: plugin/lifecycle,         target: lifecycle }
          - { component: output-teamcity,   directory: plugin/output-teamcity,   target: output-teamcity }
          - { component: repeat,            directory: plugin/repeat,            target: repeat }
          - { component: retry,             directory: plugin/retry,             target: retry }
          - { component: test,              directory: plugin/test,              target: test }
    steps:
      - name: ⤵ Checkout monorepo (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🏷 Extract bare version from component tag
        id: tag
        run: echo "version=${GITHUB_REF_NAME#${{ matrix.component }}-}" >> "$GITHUB_OUTPUT"

      - name: 🌿 Resolve source branch for the tag
        id: branch
        # Tag is created on a major-version branch (1.x, 2.x, …). Push the subtree
        # into the same branch name on the target repo so major series stay isolated.
        run: |
          branch=$(git branch --remotes --contains "${GITHUB_REF_NAME}" \
                    | sed 's|origin/||' \
                    | grep -v 'HEAD' \
                    | head -n 1 \
                    | tr -d ' ')
          echo "name=${branch}" >> "$GITHUB_OUTPUT"

      - name: 🚀 Push subtree to php-testo/${{ matrix.target }}
        uses: symplify/monorepo-split-github-action@v2.3.0
        with:
          tag: ${{ steps.tag.outputs.version }}
          package_directory: ${{ matrix.directory }}
          repository_organization: php-testo
          repository_name: ${{ matrix.target }}
          branch: ${{ steps.branch.outputs.name }}
          user_name: 'github-actions[bot]'
          user_email: '41898282+github-actions[bot]@users.noreply.github.com'
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}

...
